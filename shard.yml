name: succ_cr
version: 0.1.1
description: Source Engine Unofficial Character Controller (SUCC) ported to Crystal for Lapis — Quake/Source-style 3D character movement for Godot 4
authors:
  - Ian Rash <redcodefinal@gmail.com>
  - Mark Arneman (bearlikelion) <https://github.com/bearlikelion/SUCC>
